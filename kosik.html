<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Košík – Dominikine náramky 💕</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fff8fc;
    color: #25212a;
    line-height: 1.6;
}

/* =========================
   HORNÁ AKCIA
========================= */

.sale-bar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: linear-gradient(90deg,#e83f91,#ff6eae,#e83f91);
    color: white;
    text-align: center;
    padding: 10px 15px;
    font-size: 14px;
    font-weight: 700;
}

#countdown {
    display: inline-block;
    margin-left: 10px;
    padding: 4px 10px;
    background: rgba(255,255,255,.95);
    color: #d93682;
    border-radius: 20px;
    font-size: 13px;
}

.black-friday {
    display: none;
    margin-left: 10px;
    padding: 4px 12px;
    background: #111;
    color: white;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1px;
}

body.friday-sale .black-friday {
    display: inline-block;
    animation:
        blackFridayBlink
        .8s
        infinite
        alternate;
}

@keyframes blackFridayBlink {

    from {
        opacity: 1;
        transform: scale(1);
    }

    to {
        opacity: .35;
        transform: scale(1.06);
    }

}

body.friday-sale .sale-bar {
    background:
        linear-gradient(
            90deg,
            #050505,
            #222,
            #050505
        );
}

/* =========================
   HEADER
========================= */

header {
    position: sticky;
    top: 41px;
    z-index: 999;
    background:
        rgba(255,255,255,.92);
    backdrop-filter:
        blur(15px);
    border-bottom:
        1px solid #f1dce8;
    padding: 16px 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 25px;
}

.logo {
    color: #df438b;
    font-size: 24px;
    font-weight: 800;
    text-decoration: none;
    white-space: nowrap;
}

nav {
    display: flex;
    gap: 5px;
    align-items: center;
}

nav a {
    color: #4a4149;
    text-decoration: none;
    padding: 9px 15px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    transition: .25s;
}

nav a:hover {
    background: #fff0f7;
    color: #df438b;
}

nav a.active {
    background: #df438b;
    color: white;
    box-shadow:
        0 5px 15px
        rgba(223,67,139,.25);
}

/* =========================
   HLAVNÁ ČASŤ
========================= */

main {
    min-height: 70vh;
    padding: 80px 20px;
}

.cart-container {
    max-width: 850px;
    margin: auto;
}

.heading {
    text-align: center;
    margin-bottom: 40px;
}

.heading span {
    color: #df438b;
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

.heading h1 {
    margin-top: 5px;
    font-size:
        clamp(34px, 6vw, 50px);
    color: #29232b;
}

.heading p {
    margin-top: 8px;
    color: #81757e;
}

/* =========================
   KOŠÍK
========================= */

.cart-box {
    background: white;
    border:
        1px solid #f0dce6;
    border-radius: 24px;
    padding: 30px;
    box-shadow:
        0 12px 35px
        rgba(40,20,30,.06);
}

.empty-cart {
    text-align: center;
    padding: 50px 20px;
    color: #8c8188;
}

.empty-cart-icon {
    font-size: 55px;
    margin-bottom: 10px;
}

.cart-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 18px 0;
    border-bottom:
        1px solid #f1e5eb;
}

.cart-item-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.cart-item-icon {
    width: 65px;
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        linear-gradient(
            135deg,
            #fff0f7,
            #ffe0ed
        );
    border-radius: 15px;
    font-size: 30px;
}

.cart-item-name {
    font-weight: 800;
    color: #29232b;
}

.cart-item-price {
    color: #df438b;
    font-weight: 800;
    margin-top: 3px;
}

.remove-button {
    border: none;
    background: #fff0f5;
    color: #d53c82;
    padding: 9px 13px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
    transition: .2s;
}

.remove-button:hover {
    background: #ffe0ec;
}

/* =========================
   CELKOVÁ CENA
========================= */

.total-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 25px;
    padding-top: 20px;
    border-top:
        1px solid #f0e2e9;
    font-size: 23px;
    font-weight: 900;
}

.total-price {
    color: #df438b;
}

/* =========================
   OBJEDNÁVKA
========================= */

.checkout {
    margin-top: 30px;
    padding-top: 30px;
    border-top:
        1px solid #f0e2e9;
}

.checkout h2 {
    margin-bottom: 18px;
    color: #29232b;
}

.checkout input {
    width: 100%;
    padding: 14px 15px;
    margin-bottom: 12px;
    border:
        1px solid #ead9e2;
    border-radius: 12px;
    outline: none;
    background: #fffafd;
    font-size: 14px;
    transition: .2s;
}

.checkout input:focus {
    border-color: #df438b;
    box-shadow:
        0 0 0 3px
        rgba(223,67,139,.10);
}

.order-button {
    width: 100%;
    border: none;
    border-radius: 13px;
    padding: 15px;
    background: #df438b;
    color: white;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: .25s;
}

.order-button:hover {
    background: #c92f78;
    transform: translateY(-1px);
}

/* =========================
   SPÄŤ
========================= */

.back-button {
    display: block;
    width: fit-content;
    margin: 25px auto 0;
    padding: 12px 20px;
    background: white;
    color: #df438b;
    border:
        1px solid #f0c9dc;
    border-radius: 13px;
    text-decoration: none;
    font-weight: 800;
    transition: .25s;
}

.back-button:hover {
    background: #fff0f7;
}

/* =========================
   FOOTER
========================= */

footer {
    background: #211c22;
    color: #cfc5cc;
    text-align: center;
    padding: 30px 20px;
    font-size: 14px;
}

footer strong {
    color: white;
}

/* =========================
   MOBIL
========================= */

@media (max-width: 800px) {

    header {
        flex-direction: column;
        padding: 14px 15px;
        top: 39px;
    }

    nav {
        flex-wrap: wrap;
        justify-content: center;
    }

}

@media (max-width: 500px) {

    .sale-bar {
        font-size: 12px;
    }

    #countdown {
        display: inline-block;
        margin: 5px 2px 0;
    }

    .black-friday {
        margin-left: 2px;
    }

    .logo {
        font-size: 21px;
    }

    nav a {
        padding: 8px 10px;
        font-size: 13px;
    }

    main {
        padding:
            55px 15px;
    }

    .cart-box {
        padding: 20px;
    }

    .cart-item {
        align-items: flex-start;
        flex-direction: column;
    }

    .remove-button {
        align-self: flex-end;
    }

}

</style>
</head>

<body>

<!-- HORNÁ AKCIA -->

<div class="sale-bar">

    <span id="saleText">
        🔥 V PIATOK -70 % NA VŠETKY NÁRAMKY
    </span>

    <span id="countdown">
        Načítavam...
    </span>

    <span class="black-friday">
        🖤 BLACK FRIDAY
    </span>

</div>


<!-- HEADER -->

<header>

    <a
        href="index.html"
        class="logo">

        Dominikine náramky 💕

    </a>


    <nav>

        <a href="index.html">
            Domov
        </a>

        <a
            href="kosik.html"
            class="active">

            🛒 Košík

        </a>

        <a href="kontakt.html">

            Kontakt

        </a>

    </nav>

</header>


<!-- HLAVNÁ ČASŤ -->

<main>

    <div class="cart-container">


        <div class="heading">

            <span>
                Tvoja objednávka
            </span>

            <h1>
                🛒 Košík
            </h1>

            <p>
                Skontroluj svoje produkty
                pred objednaním. 💕
            </p>

        </div>


        <div class="cart-box">


            <!-- PRODUKTY -->

            <div id="cartItems">

                <!-- JavaScript sem vloží produkty -->

            </div>


            <!-- CELKOM -->

            <div
                class="total-box"
                id="totalBox">

                <span>
                    Spolu
                </span>

                <span
                    class="total-price"
                    id="totalPrice">

                    0,00 €

                </span>

            </div>


            <!-- OBJEDNÁVKA -->

            <div
                class="checkout"
                id="checkout">

                <h2>
                    Údaje pre doručenie 📦
                </h2>


                <input
                    type="text"
                    id="name"
                    placeholder="Meno a priezvisko"
                >


                <input
                    type="text"
                    id="address"
                    placeholder="Adresa doručenia"
                >


                <input
                    type="tel"
                    id="phone"
                    placeholder="Telefón"
                >


                <button
                    class="order-button"
                    onclick="sendOrder()">

                    Objednať na dobierku 📦

                </button>

            </div>


        </div>


        <a
            href="index.html"
            class="back-button">

            ← Späť na domov

        </a>


    </div>

</main>


<!-- FOOTER -->

<footer>

    <p>

        © 2026

        <strong>
            Dominikine náramky
        </strong>

        · Vyrobené s 💕

    </p>

</footer>


<script>

/* =========================
   PIATOK
========================= */

function isFriday() {

    return new Date().getDay() === 5;

}


/* =========================
   AKCIA
========================= */

function updateSale() {

    if (isFriday()) {

        document.body.classList.add(
            "friday-sale"
        );

        document.getElementById(
            "saleText"
        ).textContent =
            "🔥 DNES JE PIATOK -70 % 🔥";

    } else {

        document.body.classList.remove(
            "friday-sale"
        );

        document.getElementById(
            "saleText"
        ).textContent =
            "🔥 V PIATOK -70 % NA VŠETKY NÁRAMKY";

    }

}


/* =========================
   ODPOČET
========================= */

function updateCountdown() {

    const now =
        new Date();

    let target =
        new Date(now);


    if (isFriday()) {

        target.setHours(
            23,
            59,
            59,
            999
        );

    } else {

        const daysUntilFriday =
            (5 - now.getDay() + 7) % 7;

        target.setDate(
            now.getDate()
            +
            daysUntilFriday
        );

        target.setHours(
            0,
            0,
            0,
            0
        );

    }


    const difference =
        target - now;


    const days =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );


    const hours =
        Math.floor(
            (
                difference /
                (1000 * 60 * 60)
            ) % 24
        );


    const minutes =
        Math.floor(
            (
                difference /
                (1000 * 60)
            ) % 60
        );


    const seconds =
        Math.floor(
            (
                difference /
                1000
            ) % 60
        );


    document.getElementById(
        "countdown"
    ).textContent =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;


    updateSale();

}


updateCountdown();

setInterval(
    updateCountdown,
    1000
);


/* =========================
   NAČÍTANIE KOŠÍKA
========================= */

function loadCart() {

    const cart =
        JSON.parse(
            localStorage.getItem(
                "dominikinEshopCart"
            )
        ) || [];


    const cartItems =
        document.getElementById(
            "cartItems"
        );


    const checkout =
        document.getElementById(
            "checkout"
        );


    const totalBox =
        document.getElementById(
            "totalBox"
        );


    const totalPrice =
        document.getElementById(
            "totalPrice"
        );


    if (cart.length === 0) {

        cartItems.innerHTML = `

            <div class="empty-cart">

                <div class="empty-cart-icon">
                    🛒
                </div>

                <h2>
                    Košík je prázdny
                </h2>

                <p>
                    Zatiaľ tu nemáš žiadny náramok. 💕
                </p>

            </div>

        `;


        checkout.style.display =
            "none";

        totalBox.style.display =
            "none";

        return;

    }


    cartItems.innerHTML = "";


    let total = 0;


    cart.forEach(
        (item, index) => {

            total +=
                Number(item.price);


            const itemElement =
                document.createElement(
                    "div"
                );


            itemElement.className =
                "cart-item";


            itemElement.innerHTML = `

                <div class="cart-item-left">

                    <div class="cart-item-icon">
                        📿
                    </div>

                    <div>

                        <div class="cart-item-name">
                            ${item.name}
                        </div>

                        <div class="cart-item-price">

                            ${Number(item.price)
                                .toFixed(2)
                                .replace(".", ",")}

                            €

                        </div>

                    </div>

                </div>


                <button
                    class="remove-button"
                    onclick="removeItem(${index})">

                    Odstrániť

                </button>

            `;


            cartItems.appendChild(
                itemElement
            );

        }
    );


    totalPrice.textContent =
        total
            .toFixed(2)
            .replace(".", ",")
        + " €";


    checkout.style.display =
        "block";


    totalBox.style.display =
        "flex";

}


/* =========================
   ODSTRÁNENIE PRODUKTU
========================= */

function removeItem(index) {

    let cart =
        JSON.parse(
            localStorage.getItem(
                "dominikinEshopCart"
            )
        ) || [];


    cart.splice(
        index,
        1
    );


    localStorage.setItem(
        "dominikinEshopCart",
        JSON.stringify(cart)
    );


    loadCart();

}


/* =========================
   OBJEDNÁVKA
========================= */

function sendOrder() {

    const name =
        document.getElementById(
            "name"
        ).value.trim();


    const address =
        document.getElementById(
            "address"
        ).value.trim();


    const phone =
        document.getElementById(
            "phone"
        ).value.trim();


    const cart =
        JSON.parse(
            localStorage.getItem(
                "dominikinEshopCart"
            )
        ) || [];


    if (
        !name ||
        !address ||
        !phone
    ) {

        alert(
            "Prosím, vyplň všetky údaje."
        );

        return;

    }


    if (cart.length === 0) {

        alert(
            "Košík je prázdny."
        );

        return;

    }


    alert(
        "Objednávka bola pripravená na odoslanie na dobierku. 📦"
    );

}


/* =========================
   SPUSTENIE
========================= */

loadCart();

</script>

</body>
</html>
